name: CI Safety Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/okc_wholesale_ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/okc_wholesale_ci?schema=public"
  AUTH_SECRET: "ci-build-only-auth-secret-not-for-runtime"
  NEXTAUTH_SECRET: "ci-build-only-nextauth-secret"
  ADMIN_EMAIL: "ci-admin@jcapital.test"
  ADMIN_PASSWORD: "ci-password-not-a-secret"
  ADMIN_TENANT_ID: "default"
  NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3020"
  PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3020"
  OPENAI_EMBEDDINGS_ENABLED: "false"
  OPENAI_EMBEDDING_MODEL: "text-embedding-3-small"

jobs:
  safety-gates:
    name: TypeScript, Lint, Build, Smoke List, Safety Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: okc_wholesale_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d okc_wholesale_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npx prisma migrate deploy

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Repository integrity
        run: npm run test:repo-integrity

      - name: Maintained unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright smoke tests
        run: npm run test:e2e -- tests/e2e/smoke.spec.ts --project=chromium --workers=1

      - name: Safety invariant tests
        run: npm run test:safety

  vercel-preview-build-check:
    name: Optional Vercel Preview Build Check
    runs-on: ubuntu-latest
    needs: safety-gates
    if: ${{ vars.ENABLE_VERCEL_CHECK == 'true' }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check optional Vercel credentials
        id: vercel-credentials
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview build check skipped because one or more Vercel secrets are not configured."
          fi

      - name: Pull Vercel preview environment
        if: ${{ steps.vercel-credentials.outputs.ready == 'true' }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Run Vercel preview build
        if: ${{ steps.vercel-credentials.outputs.ready == 'true' }}
        run: npx vercel build --token="$VERCEL_TOKEN"
