services:
  professional-case-pressure-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jcapital_pressure
      POSTGRES_USER: jcapital_pressure
      POSTGRES_PASSWORD: isolated-pressure-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jcapital_pressure -d jcapital_pressure"]
      interval: 2s
      timeout: 3s
      retries: 30
